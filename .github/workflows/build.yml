name: build

on:
  schedule:
    - cron: '0 9 * * *' # 06:00 BRT
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      # Se a fonte falhar, o build falha ANTES do deploy e o dist/
      # anterior continua no ar. Nunca publicar feed vazio: apagaria a
      # agenda de todo mundo que assinou.
      - run: pnpm run build

      # O commit diário do estado também impede o GitHub de desativar
      # o cron por inatividade (60 dias sem commit em repo público).
      # snapshots.json é o fallback best-effort: última coleta boa por liga.
      - name: Commit state.json/snapshots.json se mudaram
        run: |
          if [ -n "$(git status --porcelain -- data/state.json data/snapshots.json)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git add data/state.json data/snapshots.json
            git commit -m 'chore: atualiza estado do build [skip ci]'
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
